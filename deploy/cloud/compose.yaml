# Jarvis hébergé, joignable uniquement par le réseau privé Tailscale —
# cf. docs/deploiement-cloud.md. Lancer depuis ce dossier :
#   docker compose up -d --build
#
# Aucun port n'est publié sur Internet : le conteneur tailscale rejoint ton
# réseau privé et sert Jarvis en HTTPS à https://jarvis.<ton-tailnet>.ts.net ;
# jarvis partage son espace réseau et n'écoute que sur 127.0.0.1.
services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: ${TS_HOSTNAME:-jarvis}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?clé d'authentification Tailscale manquante (.env)}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale:/config:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  jarvis:
    build:
      context: ../..
    image: jarvis:latest
    # Même espace réseau que tailscale : 127.0.0.1:8090 n'est joignable
    # que par lui, et les modèles du Mac le sont par son adresse privée.
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      MONGO_URI: ${MONGO_URI:?URI MongoDB Atlas manquante (.env)}
      TZ: ${TZ:-Europe/Luxembourg}
    command:
      - --role=cloud
      - --addr=127.0.0.1:8090
      - --vlm-url=http://${MAC_TAILNET_IP:?adresse Tailscale du Mac manquante (.env)}:${VLM_PORT:-8080}/v1
      - --vlm-model=${VLM_MODEL:-olmOCR-2-7B-1025}
      - --vlm-model-version=${VLM_MODEL_VERSION:-Q6_K}
      - --llm-url=http://${MAC_TAILNET_IP}:${LLM_PORT:-8081}/v1
      - --llm-model=${LLM_MODEL:-qwen3-8b}
      - --llm-model-version=${LLM_MODEL_VERSION:-Q5_K_M}
    volumes:
      - jarvis-data:/data
    tmpfs:
      # Fichiers temporaires de traitement (documents en cours de
      # conversion) : en mémoire, jamais sur le disque du serveur.
      - /tmp:size=2g
    restart: unless-stopped

volumes:
  tailscale-state:
  jarvis-data:
